<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sopralluogo guidato</title>
<meta name="theme-color" content="#0a8a66">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --ink:#0f1b24; --ink-2:#2b3b47; --ink-3:#5b6b78; --line:#dde5ea; --line-2:#eef3f6;
  --bg:#f4f7f9; --card:#ffffff;
  --em:#0a8a66; --em-d:#07684d; --em-l:#e6f5ef;
  --blu:#1f5fa8; --blu-l:#e8f1fb;
  --amb:#b4720a; --amb-l:#fdf3e0;
  --red:#b3261e; --red-l:#fdecea;
  --r:14px; --sh:0 1px 2px rgba(15,27,36,.06),0 8px 24px rgba(15,27,36,.06);
  --field:#fbfdfe; --field-on:#ffffff;
  --hdr:rgba(244,247,249,.94); --navbg:rgba(255,255,255,.96);
  --note-amb:#6b4a07; --note-blu:#1a4475; --note-red:#8e1d16;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ink:#e9eff3; --ink-2:#c4d0d9; --ink-3:#8ea1ae; --line:#2c3c48; --line-2:#1b2731;
    --bg:#0d151b; --card:#141f27;
    --em:#17a67d; --em-d:#46cda1; --em-l:#0f2b23;
    --blu:#74abea; --blu-l:#13243a; --amb:#dda541; --amb-l:#2a2114;
    --red:#ef8b82; --red-l:#2f1917;
    --field:#101a21; --field-on:#16222b;
    --hdr:rgba(13,21,27,.94); --navbg:rgba(20,31,39,.96);
    --note-amb:#e8c37e; --note-blu:#a9cdf5; --note-red:#f3b3ad;
    --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --ink:#e9eff3; --ink-2:#c4d0d9; --ink-3:#8ea1ae; --line:#2c3c48; --line-2:#1b2731;
  --bg:#0d151b; --card:#141f27;
  --em:#17a67d; --em-d:#46cda1; --em-l:#0f2b23;
  --blu:#74abea; --blu-l:#13243a; --amb:#dda541; --amb-l:#2a2114;
  --red:#ef8b82; --red-l:#2f1917;
  --field:#101a21; --field-on:#16222b;
  --hdr:rgba(13,21,27,.94); --navbg:rgba(20,31,39,.96);
  --note-amb:#e8c37e; --note-blu:#a9cdf5; --note-red:#f3b3ad;
  --sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;padding-bottom:104px}
h1,h2,h3,.disp{font-family:'Space Grotesk',Inter,sans-serif;letter-spacing:-.01em}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.wrap{max-width:860px;margin:0 auto;padding:0 16px}

/* header */
header{position:sticky;top:0;z-index:40;background:var(--hdr);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.htop{display:flex;align-items:center;gap:10px;padding:10px 0 8px}
.brand{display:flex;align-items:center;gap:9px;min-width:0}
.logo{width:30px;height:30px;border-radius:9px;background:var(--em);color:#fff;display:grid;place-items:center;font-weight:700;font-family:'Space Grotesk';font-size:14px;flex:none}
.brand b{font-size:15px;font-family:'Space Grotesk';white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{display:block;font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
.hbtns{margin-left:auto;display:flex;gap:6px;flex:none}
.ic{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);display:grid;place-items:center;cursor:pointer;font-size:15px}
.ic:active{transform:scale(.96)}
.prog{height:5px;background:var(--line-2);border-radius:99px;overflow:hidden;margin-bottom:8px}
.prog i{display:block;height:100%;background:var(--em);border-radius:99px;transition:width .3s ease}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:9px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font-size:11.5px;font-weight:600;padding:5px 10px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink-3);cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip.ok{border-color:var(--em);color:var(--em-d);background:var(--em-l)}
.chip.ok.on{background:var(--em);color:#fff;border-color:var(--em)}

/* step */
.step{display:none;animation:in .22s ease}
.step.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fase{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--blu);background:var(--blu-l);padding:4px 10px;border-radius:99px;margin:18px 0 10px}
h2{font-size:25px;margin:0 0 6px;line-height:1.18}
.intro{color:var(--ink-3);font-size:14.5px;margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;box-shadow:var(--sh)}
.f{margin-bottom:16px}
.f:last-child{margin-bottom:0}
label.lab{display:block;font-weight:600;font-size:14.5px;margin-bottom:6px}
label.lab em{font-style:normal;color:var(--red);font-weight:700}
.hint{font-size:12.5px;color:var(--ink-3);margin:-2px 0 7px}
input[type=text],input[type=tel],input[type=email],input[type=date],input[type=time],input[type=number],select,textarea{
  width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--field);border:1.5px solid var(--line);border-radius:11px;padding:11px 12px;outline:none}
textarea{min-height:88px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--em);background:var(--field-on);box-shadow:0 0 0 3px var(--em-l)}
input.err,select.err,textarea.err{border-color:var(--red);background:var(--red-l)}
select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%238ea1ae' stroke-width='3'><path d='M6 9l6 6 6-6'/></svg>");background-repeat:no-repeat;background-position:right 12px center;padding-right:34px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.row{grid-template-columns:1fr}}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);background:var(--field);border-radius:11px;padding:9px 12px;font-size:14.5px;cursor:pointer;user-select:none}
.opt input{accent-color:var(--em);width:18px;height:18px;margin:0;flex:none;pointer-events:none}
.opts.err,.lv.err,.flagbox.err{outline:2px solid var(--red);outline-offset:3px;border-radius:12px}
.opt.sel{border-color:var(--em);background:var(--em-l);font-weight:600}
.opts.col{flex-direction:column}
.opts.col .opt{width:100%}
.lv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lv.q4{grid-template-columns:repeat(2,1fr)}
.lv .opt{justify-content:center}
.lv .opt.sel[data-v="Alto"],.lv .opt.sel[data-v="Grave — emergenza"]{border-color:var(--red);background:var(--red-l);color:var(--red)}
.lv .opt.sel[data-v="Medio"],.lv .opt.sel[data-v="Diffusa"]{border-color:var(--amb);background:var(--amb-l);color:var(--amb)}
.flag{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1.5px solid var(--line);border-radius:11px;background:var(--field);margin-bottom:8px;cursor:pointer;font-size:14.5px}
.flag input{accent-color:var(--em);width:20px;height:20px;margin:1px 0 0;flex:none;pointer-events:none}
.flag.sel{border-color:var(--em);background:var(--em-l)}
.flag.req:not(.sel){border-color:var(--amb);background:var(--amb-l)}
.qty{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line);border-radius:11px;margin-bottom:7px;background:var(--field)}
.qty span{flex:1;font-size:14px}
.qty button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--field-on);font-size:18px;font-weight:700;color:var(--ink-2);cursor:pointer;flex:none}
.qty b{min-width:30px;text-align:center;font-family:'JetBrains Mono';font-size:16px}
.qty.has{border-color:var(--em);background:var(--em-l)}
.note{border-left:3px solid var(--amb);background:var(--amb-l);padding:11px 13px;border-radius:0 11px 11px 0;font-size:13.5px;color:var(--note-amb);margin:12px 0}
.note.blu{border-color:var(--blu);background:var(--blu-l);color:var(--note-blu)}
.note.em{border-color:var(--em);background:var(--em-l);color:var(--em-d)}
.quote{background:var(--em);color:#fff;border-radius:var(--r);padding:14px 16px;font-size:14.5px;line-height:1.55;margin-bottom:10px}
.quote b{display:block;font-family:'Space Grotesk';font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85;margin-bottom:6px}
.copy{margin-top:10px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);color:#fff;border-radius:9px;padding:7px 13px;font:inherit;font-size:13px;font-weight:600;cursor:pointer}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-top:10px}
.ph{position:relative;aspect-ratio:1;border-radius:11px;overflow:hidden;border:1px solid var(--line)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:7px;border:0;background:rgba(15,27,36,.72);color:#fff;font-size:13px;cursor:pointer}
.addph{aspect-ratio:1;border:1.5px dashed var(--line);border-radius:11px;background:var(--field);color:var(--ink-3);display:grid;place-items:center;font-size:12px;text-align:center;cursor:pointer;gap:2px}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;margin-top:4px}
.tbl th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--line-2);vertical-align:top}
.tbl td.n{text-align:right;font-family:'JetBrains Mono';white-space:nowrap}
.tbl tr.tot td{font-weight:700;border-top:1.5px solid var(--ink);border-bottom:0;background:var(--line-2)}
.tbl tr.tot td.n{color:var(--em-d)}
.sum{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.sum div{flex:1;min-width:120px;background:var(--line-2);border-radius:11px;padding:10px 12px}
.sum b{display:block;font-family:'JetBrains Mono';font-size:19px;color:var(--em-d)}
.sum i{font-style:normal;font-size:11.5px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em}
.rec{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:9px;background:var(--field)}
.rec h4{margin:0 0 6px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);font-family:'Space Grotesk'}
.rec p{margin:0;font-size:14px}
.kv{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.kv:last-child{border:0}
.kv b{flex:0 0 42%;font-weight:600;color:var(--ink-2)}
.kv span{flex:1;color:var(--ink)}
.miss{background:var(--red-l);border:1px solid var(--line);color:var(--note-red);border-radius:12px;padding:12px 14px;font-size:14px;margin-bottom:12px}
.miss b{display:block;margin-bottom:5px}
.miss li{margin-bottom:3px}
.miss ul{margin:0;padding-left:18px}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--navbg);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.nav .wrap{display:flex;gap:10px;align-items:center}
.btn{flex:1;font:inherit;font-size:15.5px;font-weight:700;padding:14px 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink-2);cursor:pointer;font-family:'Space Grotesk'}
.btn.pri{background:var(--em);border-color:var(--em);color:#fff;flex:2}
.btn.pri:disabled{opacity:.5}
.btn:active{transform:translateY(1px)}
.btn.sec{flex:none;width:52px}
.save{font-size:11.5px;color:var(--ink-3);text-align:center;padding-top:2px}

/* modal */
.mod{position:fixed;inset:0;z-index:90;background:rgba(15,27,36,.55);display:none;align-items:flex-end;justify-content:center}
.mod.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 18px calc(22px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 4px;font-size:19px}
.sheet p.sub{margin:0 0 16px;color:var(--ink-3);font-size:14px}
.sheet .btn{width:100%;margin-top:9px}
@media(min-width:600px){.mod{align-items:center}.sheet{border-radius:18px}}
.ok-big{text-align:center;padding:14px 0 4px}
.ok-big .tick{width:64px;height:64px;border-radius:50%;background:var(--em-l);color:var(--em);display:grid;place-items:center;font-size:32px;margin:0 auto 12px}
.arch{border:1px solid var(--line);border-radius:11px;padding:10px 12px;margin-bottom:8px;font-size:14px;display:flex;gap:10px;align-items:center}
.arch b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.arch small{color:var(--ink-3);font-family:'JetBrains Mono';font-size:11.5px}
.arch button{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
.tagline{font-size:11.5px;color:var(--ink-3);text-align:center;padding:18px 0 4px}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <div class="htop">
      <div class="brand">
        <div class="logo">NS</div>
        <div>
          <b id="hAz">Nuove Soluzioni Ambientali</b>
          <span>Sopralluogo guidato</span>
        </div>
      </div>
      <div class="hbtns">
        <button class="ic" id="btnArch" title="Sopralluoghi inviati">&#128451;</button>
        <button class="ic" id="btnCfg" title="Impostazioni">&#9881;</button>
      </div>
    </div>
    <div class="prog"><i id="prog" style="width:8%"></i></div>
    <div class="chips" id="chips"></div>
  </div>
</header>

<main class="wrap" id="main"></main>

<div class="nav">
  <div class="wrap">
    <button class="btn sec" id="bBack">&#8592;</button>
    <button class="btn pri" id="bNext">Avanti</button>
  </div>
  <div class="save" id="saveState">Bozza salvata sul telefono</div>
</div>

<div class="mod" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
/* ============================================================
   APP SOPRALLUOGHI — Nuove Soluzioni Ambientali / Sanitech
   File unico, nessun backend. Il percorso ricalca il ciclo di
   erogazione del servizio della UNI EN 16636 (cap. 5, 12 fasi)
   innestato sul metodo commerciale aziendale.
   ============================================================ */

/* ---------- CONFIGURAZIONE (modificabile anche da ingranaggio) ---------- */
const CFG_DEF = {
  destinatario: 'sanitech.bosco@gmail.com',   // dove arriva il PDF a fine iter
  copiaUfficio: 'Salvo Belluardo'
};
const LS = 'nsa_sopralluoghi_v1';

const TECNICI = ['Labarile Sabino','Firera Daniele','Alecci Giovanni','Lo Medico Luca','Bosco Salvatore','Aprile Giacomo','Amici Giuseppe','Altro (indicare sotto)'];

/* ---------- SCHEMA DEL PERCORSO ---------- */
const STEPS = [
{ id:'tecnico', fase:'Fase 5.1 — Contatto con il cliente', tab:'Tecnico',
  titolo:'Inserisci i tuoi dati',
  intro:'Ogni sopralluogo parte da chi lo esegue: il rapporto che arriva in ufficio porta il tuo nome e la tua azienda.',
  campi:[
   {k:'tecnico', t:'select', lab:'Tecnico che esegue il sopralluogo', req:1, opts:TECNICI},
   {k:'tecnicoAltro', t:'text', lab:'Se hai scelto «Altro», scrivi nome e cognome'},
   {k:'azienda', t:'radio', lab:'Azienda per cui esegui il sopralluogo', req:1, opts:['NSA srl','Sanitech srl']},
   {k:'data', t:'date', lab:'Data del sopralluogo', req:1, half:1},
   {k:'ora', t:'time', lab:'Ora di arrivo', half:1},
   {k:'fonte', t:'select', lab:'Da dove arriva il contatto', opts:['Telefonata','Modulo online / sito','WhatsApp','Passaparola','Cliente già nostro','Visita diretta','Segnalazione tecnico','Altro']},
   {k:'f_presentato', t:'flag', lab:'Ho presentato il servizio e fissato l\u2019appuntamento per il sopralluogo'}
  ]},

{ id:'cliente', fase:'Fase 5.1 — Dati del cliente', tab:'Cliente',
  titolo:'Chi è il cliente',
  intro:'Questi sono i dati che servono all\u2019ufficio per preparare il preventivo. Raccoglili tutti adesso: tornare indietro a chiederli fa perdere giorni.',
  campi:[
   {k:'ragioneSociale', t:'text', lab:'Ragione sociale / nome del cliente', req:1},
   {k:'tipoAttivita', t:'select', lab:'Tipo di attività', req:1, opts:['Ristorazione','Bar / pasticceria','Hotel / struttura ricettiva','B&B / affittacamere','GDO / supermercato','Industria alimentare','Panificio','Macelleria / pescheria','Ufficio / negozio','Condominio','Abitazione privata','Scuola','Struttura sanitaria / RSA','Magazzino / logistica','Azienda agricola','Altro']},
   {k:'referente', t:'text', lab:'Referente in loco', half:1},
   {k:'ruolo', t:'text', lab:'Ruolo del referente', hint:'Titolare, direttore, responsabile HACCP…', half:1},
   {k:'cellulare', t:'tel', lab:'Cellulare', half:1},
   {k:'email', t:'email', lab:'Email', half:1},
   {k:'indirizzo', t:'text', lab:'Indirizzo della struttura', half:1},
   {k:'comune', t:'text', lab:'Comune', half:1},
   {k:'piva', t:'text', lab:'Partita IVA', half:1},
   {k:'codiceUnivoco', t:'text', lab:'Codice univoco (SDI)', half:1},
   {k:'pec', t:'text', lab:'PEC'},
   {k:'flagsDati', t:'flags', lab:'Dati raccolti da inviare all\u2019ufficio per il preventivo',
     hint:'Spunta solo quello che hai davvero in mano.',
     opts:['Partita IVA','Indirizzo fisico','Indirizzo email','Cellulare','Planimetria','PEC','Codice univoco']},
   {k:'f_mailUfficiale', t:'flag', lab:'Ho richiesto la mail ufficiale per tutte le comunicazioni da qui in avanti'},
   {k:'noteCliente', t:'textarea', lab:'Note sul cliente'}
  ]},

{ id:'ispezione', fase:'Fase 5.2 — Ispezione del sito', tab:'Ispezione',
  titolo:'Prima osserva. Poi parla.',
  intro:'Raccogli i dati prima di proporre qualsiasi soluzione. Regola assoluta: in questa fase non si parla né di prezzo né di prodotto.',
  campi:[
   {k:'infestanti', t:'check', lab:'Infestanti rilevati', req:1,
     opts:['Formiche','Blatte','Mosche','Zanzare','Vespe / calabroni','Roditori','Volatili','Cimici dei letti','Tarli / tarme','Pesciolini d\u2019argento','Ragni','Altro']},
   {k:'specie', t:'textarea', lab:'Specie, stadio e comportamento osservato'},
   {k:'ambienti', t:'check', lab:'Ambienti interessati',
     opts:['Cucina','Magazzino alimenti','Sala / zona clienti','Bagni','Spogliatoi','Cortile / esterno','Cantina / interrato','Sottotetto','Cavedi e impianti','Area rifiuti','Celle frigo','Camere','Laboratorio','Perimetro esterno']},
   {k:'zone', t:'textarea', lab:'Perimetro, punti critici e vie di accesso', hint:'Dove entra, dove passa, dove si annida.'},
   {k:'superficie', t:'number', lab:'Superficie indicativa (m²)', half:1},
   {k:'condizioni', t:'textarea', lab:'Condizioni ambientali', hint:'Umidità, temperatura, materiali presenti.'},
   {k:'fonti', t:'check', lab:'Possibili fonti e cause',
     opts:['Rifiuti gestiti male','Ristagni d\u2019acqua','Aperture non protette','Fessure e crepe','Vegetazione a ridosso','Stoccaggio a terra','Pulizie insufficienti','Scarichi e sifoni','Infiltrazioni','Materiale in disuso','Carico/scarico merci','Strutture confinanti']},
   {k:'precedenti', t:'radio', lab:'Interventi precedenti', opts:['Nessuno','Fai-da-te del cliente','Altra ditta','Nostri interventi passati']},
   {k:'precedentiNote', t:'textarea', lab:'Cosa è stato fatto e con quali risultati'},
   {k:'foto', t:'photos', lab:'Foto del sopralluogo', hint:'Fino a 6 foto: finiscono nel PDF che arriva in ufficio.'}
  ]},

/* ---------- STATO ---------- */
let S = { dati:{}, foto:[], step:0 };
let CFG = Object.assign({}, CFG_DEF);
let ARCH = [];
const $ = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur = n=>(Number(n)||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
const num = v=>{ if(v===''||v==null) return 0; return Number(String(v).replace(/\./g,'').replace(',','.'))||0; };

function load(){
  try{
    const raw = localStorage.getItem(LS);
    if(raw){ const o = JSON.parse(raw);
      if(o.cfg) CFG = Object.assign({}, CFG_DEF, o.cfg);
      if(o.arch) ARCH = o.arch;
      if(o.bozza){ S = Object.assign(S, o.bozza); }
    }
  }catch(e){}
  if(!S.dati.data) S.dati.data = new Date().toISOString().slice(0,10);
  if(!S.dati.ora){ const d=new Date(); S.dati.ora = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
}
function save(){
  const body = { cfg:CFG, arch:ARCH, bozza:{ dati:S.dati, foto:S.foto, step:S.step } };
  try{ localStorage.setItem(LS, JSON.stringify(body)); $('#saveState').textContent='Bozza salvata sul telefono'; }
  catch(e){
    try{ localStorage.setItem(LS, JSON.stringify({cfg:CFG, arch:ARCH, bozza:{dati:S.dati, foto:[], step:S.step}}));
      $('#saveState').textContent='Bozza salvata (foto escluse: memoria piena)';
    }catch(e2){ $('#saveState').textContent='Impossibile salvare la bozza su questo telefono'; }
  }
}

/* ---------- RENDER ---------- */
function campoHTML(c){
  const v = S.dati[c.k];
  const id = 'f_'+c.k;
  let h = '';
  const lab = c.t==='flag' ? '' : '<label class="lab" for="'+id+'">'+esc(c.lab)+(c.req?' <em>*</em>':'')+'</label>'+(c.hint?'<div class="hint">'+esc(c.hint)+'</div>':'');

  switch(c.t){
    case 'text': case 'tel': case 'email': case 'date': case 'time': case 'number': case 'euro': {
      const type = c.t==='euro'?'text':(c.t==='number'?'number':c.t);
      const im = (c.t==='euro'||c.t==='number')?' inputmode="decimal"':'';
      h = lab+'<input type="'+type+'" id="'+id+'" data-k="'+c.k+'"'+im+' value="'+esc(v||'')+'">';
      break;
    }
    case 'textarea':
      h = lab+'<textarea id="'+id+'" data-k="'+c.k+'">'+esc(v||'')+'</textarea>'; break;
    case 'select':
      h = lab+'<select id="'+id+'" data-k="'+c.k+'"><option value="">— seleziona —</option>'+
          c.opts.map(o=>'<option'+(v===o?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select>'; break;
    case 'radio': case 'level': {
      const cls = c.t==='level' ? ('lv'+(c.q4?' q4':'')) : ('opts'+(c.col?' col':''));
      h = lab+'<div class="'+cls+'" data-k="'+c.k+'" data-multi="0">'+
        c.opts.map(o=>'<label class="opt'+(v===o?' sel':'')+'" data-v="'+esc(o)+'"><input type="radio" name="'+id+'"'+(v===o?' checked':'')+'><span>'+esc(o)+'</span></label>').join('')+'</div>';
      break;
    }
    case 'check': {
      const arr = Array.isArray(v)?v:[];
      h = lab+'<div class="opts" data-k="'+c.k+'" data-multi="1">'+
        c.opts.map(o=>'<label class="opt'+(arr.includes(o)?' sel':'')+'" data-v="'+esc(o)+'"><input type="checkbox"'+(arr.includes(o)?' checked':'')+'><span>'+esc(o)+'</span></label>').join('')+'</div>';
      break;
    }
    case 'flags': {
      const arr = Array.isArray(v)?v:[];
      h = lab+'<div data-k="'+c.k+'" data-multi="1" class="flagbox">'+
        c.opts.map(o=>'<label class="flag'+(arr.includes(o)?' sel':'')+'" data-v="'+esc(o)+'"><input type="checkbox"'+(arr.includes(o)?' checked':'')+'><span>'+esc(o)+'</span></label>').join('')+'</div>';
      break;
    }
    case 'flag':
      h = '<label class="flag'+(v?' sel':'')+'" data-k="'+c.k+'" data-single="1"><input type="checkbox"'+(v?' checked':'')+'><span>'+esc(c.lab)+'</span></label>';
      break;
    case 'qty': {
      const o = (v&&typeof v==='object')?v:{};
      h = lab+'<div data-k="'+c.k+'" class="qtybox">'+
        c.opts.map(n=>{const q=o[n]||0;return '<div class="qty'+(q?' has':'')+'" data-n="'+esc(n)+'"><span>'+esc(n)+'</span><button type="button" data-d="-1">–</button><b>'+q+'</b><button type="button" data-d="1">+</button></div>';}).join('')+'</div>';
      break;
    }
    case 'photos':
      h = lab+'<div class="photos" id="photos"></div><input type="file" id="fileIn" accept="image/*" capture="environment" multiple hidden>';
      break;
    case 'script':
      h = lab+'<div id="box_'+c.k+'"></div>'; break;
    case 'piano':
      h = lab+'<div id="box_piano"></div>'; break;
  }
  return '<div class="f" data-f="'+c.k+'">'+h+'</div>';
}

function render(){
  const st = STEPS[S.step];
  let html = '';
  if(st.id==='invio'){ html = riepilogoHTML(); }
  else{
    html = '<div class="fase">'+esc(st.fase)+'</div><h2>'+esc(st.titolo)+'</h2>'+
      (st.intro?'<p class="intro">'+esc(st.intro)+'</p>':'')+'<div class="card">'+groupHTML(st.campi)+'</div>';
    if(st.id==='ispezione') html += '<div class="note">Regola assoluta: qualsiasi menzione prematura del costo annulla la percezione di competenza.</div>';
    if(st.id==='domande') html += '<div class="note blu">Il cliente che verbalizza il problema lo rende più reale: parla lui, non veniamo percepiti come venditori.</div>';
    if(st.id==='proposta') html += '<div class="note">In tutti i casi: 100 € alla firma del contratto. I servizi extra si pagano il giorno stesso.</div>';
  }
  $('#main').innerHTML = html;

  if(st.id==='ispezione') drawPhotos();
  if(st.id==='spiegazione') drawScriptWa();
  if(st.id==='proposta') drawPiano();
  if(st.id==='chiusura') drawScriptFu();

  $('#prog').style.width = Math.round((S.step)/(STEPS.length-1)*100)+'%';
  $('#bNext').textContent = st.id==='invio' ? 'Concludi e invia' : 'Avanti';
  $('#bBack').style.visibility = S.step===0 ? 'hidden':'visible';
  $('#hAz').textContent = S.dati.azienda || 'Nuove Soluzioni Ambientali';
  drawChips();
  window.scrollTo({top:0,behavior:'instant'});
}

function groupHTML(campi){
  let out='', i=0;
  while(i<campi.length){
    const c=campi[i];
    if(c.half && campi[i+1] && campi[i+1].half){
      out += '<div class="row">'+campoHTML(c)+campoHTML(campi[i+1])+'</div>'; i+=2;
    } else { out += campoHTML(c); i++; }
  }
  return out;
}

function drawChips(){
  $('#chips').innerHTML = STEPS.map((s,i)=>{
    const done = i<S.step && !mancanti(i).length;
    return '<button class="chip'+(i===S.step?' on':'')+(done?' ok':'')+'" data-i="'+i+'">'+(i+1)+'. '+esc(s.tab||s.titolo)+'</button>';
  }).join('');
  const on = $('#chips .chip.on'); if(on) on.scrollIntoView({block:'nearest',inline:'center'});
}

/* ---------- FOTO ---------- */
function drawPhotos(){
  const box = $('#photos'); if(!box) return;
  box.innerHTML = S.foto.map((f,i)=>'<div class="ph"><img src="'+f+'"><button data-ph="'+i+'">×</button></div>').join('')
    + (S.foto.length<6 ? '<div class="addph" id="addph"><div>＋</div><div>Foto</div></div>' : '');
  const a = $('#addph'); if(a) a.onclick = ()=>$('#fileIn').click();
  box.querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>{ S.foto.splice(+b.dataset.ph,1); save(); drawPhotos(); });
  const fi = $('#fileIn');
  if(fi) fi.onchange = async e=>{
    for(const file of Array.from(e.target.files).slice(0, 6-S.foto.length)){
      try{ S.foto.push(await shrink(file)); }catch(err){}
    }
    e.target.value=''; save(); drawPhotos();
  };
}
function shrink(file){
  return new Promise((res,rej)=>{
    const fr = new FileReader();
    fr.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const max=1000, sc=Math.min(1,max/Math.max(img.width,img.height));
        const cv=document.createElement('canvas');
        cv.width=Math.round(img.width*sc); cv.height=Math.round(img.height*sc);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        res(cv.toDataURL('image/jpeg',0.6));
      };
      img.onerror=rej; img.src=fr.result;
    };
    fr.onerror=rej; fr.readAsDataURL(file);
  });
}

function copia(t){
  const done=()=>{ $('#saveState').textContent='Testo copiato'; setTimeout(()=>$('#saveState').textContent='Bozza salvata sul telefono',1800); };
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(done).catch(()=>fallbackCopy(t,done));
  else fallbackCopy(t,done);
}
function fallbackCopy(t,cb){
  const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
  try{document.execCommand('copy');cb&&cb();}catch(e){}
  document.body.removeChild(ta);
}

/* ---------- PIANO PAGAMENTI ---------- */
/* calcoli di data in UTC: il fuso e l'ora legale sposterebbero le scadenze di un giorno */
function dataUTC(iso){
  const p = String(iso||'').split('-');
  if(p.length!==3) return null;
  const d = new Date(Date.UTC(+p[0], +p[1]-1, +p[2]));
  return isNaN(d) ? null : d;
}
function addMesi(iso, m){
  const d = dataUTC(iso); if(!d) return '';
  const giorno = d.getUTCDate();
  d.setUTCDate(1); d.setUTCMonth(d.getUTCMonth()+m);
  const ultimo = new Date(Date.UTC(d.getUTCFullYear(), d.getUTCMonth()+1, 0)).getUTCDate();
  d.setUTCDate(Math.min(giorno, ultimo));
  return d.toISOString().slice(0,10);
}
function addGiorni(iso, g){
  const d = dataUTC(iso); if(!d) return '';
  d.setUTCDate(d.getUTCDate()+g);
  return d.toISOString().slice(0,10);
}
function itdate(iso){ if(!iso) return '—'; const p=iso.split('-'); return p[2]+'/'+p[1]+'/'+p[0]; }

function calcolaPiano(){
  const C = num(S.dati.canoneAnnuo), I = num(S.dati.installazione), F = num(S.dati.fornitura);
  const m = S.dati.modalita || '';
  const dIns = S.dati.dataInstallazione || '';
  const ACC = 100;
  if(!m) return null;
  let r = {righe:[], sconto:0, nota:''};

  if(m.startsWith('A')){
    const Cs = C*0.9, Fs = F*0.95;
    r.sconto = (C-Cs)+(F-Fs);
    const tot = Cs+Fs+I;
    r.righe = [
      {q:'Alla firma del contratto', d:S.dati.data||'', v:Math.min(ACC,tot), n:'Acconto, scalato dal totale'},
      {q:'Anno anticipato + installazione', d:dIns, v:tot-Math.min(ACC,tot), n:'Sconto 10% sul canone, 5% sulla fornitura'}
    ];
    r.tot = tot;
    r.nota = 'Opzione A — tutto l\u2019anno anticipato.';
  } else if(m.startsWith('B')){
    const metaC = C/2;
    const primo = Math.max(0, metaC - ACC) + I + F;
    r.righe = [
      {q:'Alla firma del contratto', d:S.dati.data||'', v:ACC, n:'Acconto'},
      {q:'All\u2019installazione', d:dIns, v:primo, n:'Saldo fino al 50% dell\u2019annualità + installazione e fornitura'},
      {q:'Tre mesi prima della scadenza', d:addMesi(dIns||S.dati.data, 9), v:metaC, n:'Restante 50% dell\u2019annualità'}
    ];
    r.tot = C+I+F;
    r.nota = 'Opzione B — metà annualità subito, il resto tre mesi prima della scadenza.';
  } else {
    const inst = I+F, meta = inst/2, trim = C/4;
    r.righe = [
      {q:'Alla firma del contratto', d:S.dati.data||'', v:ACC, n:'Acconto'},
      {q:'Giorno dell\u2019installazione (contanti)', d:dIns, v:Math.max(0,meta-ACC), n:'50% di installazione e fornitura, meno l\u2019acconto'},
      {q:'Dopo 30 giorni', d:addGiorni(dIns||S.dati.data,30), v:meta+trim, n:'Saldo installazione + primo trimestre'},
      {q:'Trimestri successivi', d:addGiorni(dIns||S.dati.data,120), v:trim, n:'Poi ogni tre mesi'}
    ];
    r.tot = C+I+F;
    r.nota = 'Opzione C — installazione a metà e metà, trimestre dopo 30 giorni.';
  }
  return r;
}
function drawPiano(){
  const b = $('#box_piano'); if(!b) return;
  const p = calcolaPiano();
  if(!p){ b.innerHTML = '<div class="note blu">Scegli una modalità per vedere il piano dei pagamenti.</div>'; return; }
  b.innerHTML =
    '<div class="sum"><div><i>Totale primo anno</i><b>'+eur(p.tot)+'</b></div>'+
    (p.sconto>0?'<div><i>Sconto applicato</i><b>'+eur(p.sconto)+'</b></div>':'')+'</div>'+
    '<table class="tbl"><thead><tr><th>Quando</th><th>Data</th><th style="text-align:right">Importo</th></tr></thead><tbody>'+
    p.righe.map(r=>'<tr><td><b>'+esc(r.q)+'</b><br><span style="color:var(--ink-3);font-size:12.5px">'+esc(r.n)+'</span></td><td class="mono" style="font-size:12.5px">'+itdate(r.d)+'</td><td class="n">'+eur(r.v)+'</td></tr>').join('')+
    '</tbody></table><div class="note em" style="margin-top:10px">'+esc(p.nota)+' Possibilità di pagare semestre o anno con sconti del 5% e del 10%.</div>';
}

/* ---------- VALIDAZIONE ---------- */
function mancanti(i){
  const st = STEPS[i]; const out=[];
  (st.campi||[]).forEach(c=>{
    if(!c.req) return;
    const v = S.dati[c.k];
    const vuoto = v==null || v==='' || (Array.isArray(v)&&!v.length);
    if(vuoto) out.push(c.lab);
  });
  return out;
}

/* ---------- RIEPILOGO ---------- */
function valoreTesto(c){
  const v = S.dati[c.k];
  if(v==null||v===''||(Array.isArray(v)&&!v.length)) return '';
  if(c.t==='flag') return v?'Sì':'No';
  if(c.t==='check') return v.join(', ');
  if(c.t==='flags') return v.join(' · ');
  if(c.t==='qty'){ const o=Object.entries(v).filter(x=>x[1]>0); return o.length? o.map(x=>x[0]+' × '+x[1]).join(', '):''; }
  if(c.t==='euro') return eur(num(v));
  if(c.t==='date') return itdate(v);
  return String(v);
}

    ' · '+esc(S.dati.azienda||'—')+' · '+itdate(S.dati.data)+'</p></div>'+

    (p?'<div class="rec"><h4>Proposta</h4><p>'+esc(S.dati.modalita||'').split(':')[0]+' — totale primo anno <b>'+eur(p.tot)+'</b></p></div>':'')+
    (S.foto.length?'<div class="rec"><h4>Foto</h4><p>'+S.foto.length+' allegate al PDF</p></div>':'')+

    return righe? '<h4 style="margin:14px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--blu);font-family:\'Space Grotesk\'">'+esc(s.fase)+'</h4>'+righe : '';

/* ---------- PDF ---------- */
function buildPDF(){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const W=210, M=16; let y=0;
  const tecnico = S.dati.tecnico==='Altro (indicare sotto)'?(S.dati.tecnicoAltro||''):(S.dati.tecnico||'');

  // intestazione
  doc.setFillColor(10,138,102); doc.rect(0,0,W,30,'F');
  doc.setTextColor(255); doc.setFont('helvetica','bold'); doc.setFontSize(16);
  doc.text('Rapporto di sopralluogo', M, 13);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.5);
  doc.text((S.dati.azienda||'Nuove Soluzioni Ambientali')+'  ·  '+itdate(S.dati.data)+(S.dati.ora?('  ·  '+S.dati.ora):''), M, 20);
  doc.text('Tecnico: '+(tecnico||'—'), M, 25.5);
  doc.setTextColor(40);
  y = 40;

  const nl = (h)=>{ if(y+h>278){ doc.addPage(); y=20; } };
  function titolo(t){
    nl(16); y+=3;
    doc.setFillColor(237,243,246); doc.rect(M-3, y-4.6, W-2*M+6, 7.6,'F');
    doc.setFont('helvetica','bold'); doc.setFontSize(9.6); doc.setTextColor(31,95,168);
    doc.text(t.toUpperCase(), M, y); doc.setTextColor(40); y+=8.5;
  }
  function riga(k, v){
    doc.setFontSize(9.4);
    const kw = 58;
    const vl = doc.splitTextToSize(String(v), W-2*M-kw);
    const kl = doc.splitTextToSize(String(k), kw-4);
    const h = Math.max(vl.length, kl.length)*4.4+2.2;
    nl(h);
    doc.setFont('helvetica','bold'); doc.setTextColor(70); doc.text(kl, M, y);
    doc.setFont('helvetica','normal'); doc.setTextColor(25); doc.text(vl, M+kw, y);
    y += h;
    doc.setDrawColor(238,243,246); doc.line(M, y-1.6, W-M, y-1.6);
  }

  // blocco cliente in evidenza
  nl(26);
  doc.setDrawColor(222,229,234); doc.setFillColor(251,253,254);
  doc.roundedRect(M-3, y-5, W-2*M+6, 24, 2, 2, 'FD');
  doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.text(S.dati.ragioneSociale||'—', M, y+2);
  doc.setFont('helvetica','normal'); doc.setFontSize(9.2); doc.setTextColor(90);
  doc.text([S.dati.tipoAttivita, S.dati.indirizzo, S.dati.comune].filter(Boolean).join(' · ')||'—', M, y+8);
  doc.text([S.dati.referente&&('Ref. '+S.dati.referente), S.dati.cellulare, S.dati.email].filter(Boolean).join('  ·  ')||'—', M, y+13.5);
  doc.setTextColor(40); y += 26;

  STEPS.forEach(s=>{
    if(!s.campi.length) return;
    const righe = s.campi.map(c=>({k:c.lab, v:valoreTesto(c)})).filter(r=>r.v);
    if(!righe.length) return;
    titolo(s.fase);
    righe.forEach(r=>riga(r.k, r.v));
  });

  // piano pagamenti
  const p = calcolaPiano();
  if(p){
    titolo('Piano dei pagamenti');
    p.righe.forEach(r=>riga(r.q+' ('+itdate(r.d)+')', eur(r.v)+' — '+r.n));
    riga('Totale primo anno', eur(p.tot)+(p.sconto>0?('  (sconto '+eur(p.sconto)+')'):''));
  }

  // testo whatsapp usato
  titolo('Testo inviato al cliente');
  riga('WhatsApp', testoWa());

  // foto
  if(S.foto.length){
    doc.addPage(); y=20;
    doc.setFont('helvetica','bold'); doc.setFontSize(12); doc.text('Foto del sopralluogo', M, y); y+=7;
    const w=(W-2*M-6)/2, h=w*0.75;
    S.foto.forEach((f,i)=>{
      const col=i%2, row=Math.floor(i/2);
      if(row>0 && col===0 && y+h>270){ doc.addPage(); y=20; }
      const x = M+col*(w+6);
      try{ doc.addImage(f,'JPEG',x,y,w,h); }catch(e){}
      if(col===1) y += h+6;
    });
    if(S.foto.length%2===1) y += h+6;
  }

  // piè di pagina
  const n = doc.internal.getNumberOfPages();
  for(let i=1;i<=n;i++){
    doc.setPage(i); doc.setFontSize(7.6); doc.setTextColor(140);
    doc.text('Percorso conforme al ciclo di erogazione del servizio UNI EN 16636 (cap. 5)  ·  '+(S.dati.azienda||''), M, 288);
    doc.text(i+'/'+n, W-M, 288, {align:'right'});
  }
  return doc;
}
function nomeFile(){
  const c = (S.dati.ragioneSociale||'cliente').replace(/[^A-Za-z0-9àèéìòùÀÈÉÌÒÙ ]/g,'').trim().replace(/\s+/g,'_').slice(0,40);
  return 'Sopralluogo_'+c+'_'+(S.dati.data||'').replace(/-/g,'')+'.pdf';
}

/* ---------- INVIO ---------- */
async function concludi(){
  const man=[]; STEPS.forEach((s,i)=>{ const m=mancanti(i); if(m.length) man.push(s.tab+': '+m.join(', ')); });
  if(man.length){ sheet('<h3>Mancano dei dati</h3><p class="sub">Completa i campi obbligatori prima di inviare.</p><div class="miss"><ul>'+man.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul></div><button class="btn" data-close>Torna indietro</button>'); return; }

  sheet('<h3>Preparo il PDF…</h3><p class="sub">Un attimo: sto mettendo insieme dati e foto.</p>');
  let doc, blob;
  try{ doc = buildPDF(); blob = doc.output('blob'); }
  catch(e){ sheet('<h3>Errore nel PDF</h3><p class="sub">'+esc(e.message||e)+'</p><button class="btn" data-close>Chiudi</button>'); return; }

  const file = new File([blob], nomeFile(), {type:'application/pdf'});
  const oggetto = oggettoMail();
  const corpo = corpoMail();

  archivia();
  fine(doc, file, oggetto, corpo);
}
function nomeTecnico(){
  return S.dati.tecnico==='Altro (indicare sotto)' ? (S.dati.tecnicoAltro||'') : (S.dati.tecnico||'');
}
function oggettoMail(){
  return [S.dati.ragioneSociale||'Cliente', nomeTecnico(), S.dati.comune].filter(Boolean).join(' — ');
}
function corpoMail(){
  const t = nomeTecnico();
  const p = calcolaPiano();
  return [
    'Sopralluogo completato.',
    '',
    'Cliente: '+(S.dati.ragioneSociale||'—')+' ('+(S.dati.tipoAttivita||'—')+')',
    'Indirizzo: '+[S.dati.indirizzo,S.dati.comune].filter(Boolean).join(', '),
    'Referente: '+[S.dati.referente,S.dati.cellulare,S.dati.email].filter(Boolean).join(' · '),
    'Tecnico: '+t+' — '+(S.dati.azienda||''),
    'Data: '+itdate(S.dati.data),
    '',
    'Infestanti: '+((S.dati.infestanti||[]).join(', ')||'—'),
    'Livello: '+(S.dati.livello||'—'),
    'Frequenza monitoraggio: '+(S.dati.frequenza||'—'),
    'Modalità di pagamento: '+(S.dati.modalita||'—'),
    p?('Totale primo anno: '+eur(p.tot)):'',
    'Esito: '+(S.dati.esito||'—'),
    '',
    'Il rapporto completo è nel PDF allegato.'
  ].filter(x=>x!=='').join('\n');
}
function archivia(){
  ARCH.unshift({ t: Date.now(), cliente: S.dati.ragioneSociale||'—', data: S.dati.data, dati: JSON.parse(JSON.stringify(S.dati)) });
  ARCH = ARCH.slice(0,40); save();
}
function fine(doc, file, oggetto, corpo){
  const canShare = navigator.canShare && navigator.canShare({files:[file]});
  let h = '<div class="ok-big"><div class="tick">&#10003;</div><h3>Sopralluogo completato</h3>'+
    '<p class="sub">Il PDF è pronto. Premi il tasto verde per mandarlo a '+esc(CFG.destinatario)+'.</p></div>'+
    '<div class="note blu" style="margin-top:0">Oggetto della mail:<br><b>'+esc(oggetto)+'</b></div>';
  if(canShare) h += '<button class="btn pri" data-act="share">Invia la mail con il PDF allegato</button>';
  h += '<button class="btn'+(canShare?'':' pri')+'" data-act="mail">Apri la mail già compilata</button>';
  h += '<button class="btn" data-act="dl">Scarica il PDF</button>';
  h += '<button class="btn" data-act="new">Nuovo sopralluogo</button>';
  sheet(h);
  $('#sheet').querySelectorAll('[data-act]').forEach(b=>b.onclick=async()=>{
    const a=b.dataset.act;
    if(a==='dl') doc.save(nomeFile());
    if(a==='share'){
      try{ await navigator.share({files:[file], title:oggetto, text:'A: '+CFG.destinatario+'\n\n'+corpo}); }
      catch(e){ if(e && e.name!=='AbortError') apriMail(doc, oggetto, corpo); }
    }
    if(a==='mail') apriMail(doc, oggetto, corpo);
    if(a==='new'){ nuovo(); chiudi(); }
  });
}
function apriMail(doc, oggetto, corpo){
  doc.save(nomeFile());
  location.href = 'mailto:'+encodeURIComponent(CFG.destinatario)+
    '?subject='+encodeURIComponent(oggetto)+
    '&body='+encodeURIComponent(corpo+'\n\n[Allegare il PDF appena scaricato: '+nomeFile()+']');
}
function nuovo(){
  S = { dati:{ data:new Date().toISOString().slice(0,10), ora:new Date().toTimeString().slice(0,5), azienda:S.dati.azienda, tecnico:S.dati.tecnico, tecnicoAltro:S.dati.tecnicoAltro }, foto:[], step:0 };
  save(); render();
}

/* ---------- EVENTI ---------- */
$('#main').addEventListener('input', e=>{
  const el = e.target.closest('[data-k]');
  if(!el || !el.matches('input,select,textarea')) return;
  S.dati[el.dataset.k] = el.value;
  el.classList.remove('err');
  if(['canoneAnnuo','installazione','fornitura','dataInstallazione'].includes(el.dataset.k)) drawPiano();
  if(['ragioneSociale','infografica'].includes(el.dataset.k)){ drawScriptWa(); drawScriptFu(); }
  if(el.dataset.k==='azienda') $('#hAz').textContent = el.value;
  save();
});
$('#main').addEventListener('click', e=>{
  if(e.target.tagName==='INPUT' && e.target.type!=='file') return;
  // opzioni singole/multiple
  const opt = e.target.closest('.opt,.flag');
  if(opt){
    const box = opt.closest('[data-k]');
    if(opt.dataset.single!==undefined || (opt.matches('.flag') && opt.dataset.k)){
      const k = opt.dataset.k; S.dati[k] = !S.dati[k];
      opt.classList.toggle('sel', !!S.dati[k]);
      const inp=opt.querySelector('input'); if(inp) inp.checked = !!S.dati[k];
      save(); return;
    }
    if(box){
      const k = box.dataset.k, v = opt.dataset.v, multi = box.dataset.multi==='1';
      if(multi){
        const arr = Array.isArray(S.dati[k])?S.dati[k].slice():[];
        const i = arr.indexOf(v);
        if(i>=0) arr.splice(i,1); else arr.push(v);
        S.dati[k]=arr; opt.classList.toggle('sel', i<0);
        const inp=opt.querySelector('input'); if(inp) inp.checked = i<0;
      } else {
        S.dati[k]=v;
        box.querySelectorAll('.opt').forEach(o=>{o.classList.toggle('sel', o===opt); const i=o.querySelector('input'); if(i) i.checked=(o===opt);});
        if(k==='modalita') drawPiano();
        if(k==='infografica') drawScriptWa();
        if(k==='azienda') $('#hAz').textContent = v;
      }
      box.classList.remove('err'); save(); return;
    }
  }
  // quantità
  const qb = e.target.closest('.qty button');
  if(qb){
    const riga = qb.closest('.qty'), box = riga.closest('[data-k]');
    const k = box.dataset.k, n = riga.dataset.n;
    const o = (S.dati[k]&&typeof S.dati[k]==='object')?S.dati[k]:{};
    o[n] = Math.max(0, (o[n]||0) + (+qb.dataset.d));
    S.dati[k]=o; riga.querySelector('b').textContent=o[n]; riga.classList.toggle('has', o[n]>0);
    save(); return;
  }
});
$('#chips').addEventListener('click', e=>{
  const c = e.target.closest('.chip'); if(!c) return;
  S.step = +c.dataset.i; save(); render();
});
$('#bBack').onclick = ()=>{ if(S.step>0){ S.step--; save(); render(); } };
$('#bNext').onclick = ()=>{

  const man = mancanti(S.step);

    return;
  }
  if(S.step<STEPS.length-1){ S.step++; save(); render(); }
};

/* ---------- AVVIO ---------- */
load();
if(S.step>=STEPS.length) S.step=0;
render();
</script>
